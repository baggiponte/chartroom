<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Me Decide</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1b1b1a; --muted: #8a8a85; --faint: #c9c9c3; --line: #e7e7e2;
  --chip: #ffffff; --chip-hover: #f2f2ee; --ink: #141414; --ink-text: #ffffff;
  --accent: #3b6df0; --accent-soft: rgba(59,109,240,.12); --danger: #c2412d;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.07);
  --pop-shadow: 0 2px 6px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --card: #1c1c1b; --text: #ededea; --muted: #8f8f89; --faint: #55554f; --line: #2c2c2a;
    --chip: #232322; --chip-hover: #2c2c2a; --ink: #f1f1ee; --ink-text: #141414;
    --accent: #7c9cff; --accent-soft: rgba(124,156,255,.16); --danger: #ff8a73;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.35);
    --pop-shadow: 0 2px 6px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --card: #1c1c1b; --text: #ededea; --muted: #8f8f89; --faint: #55554f; --line: #2c2c2a;
  --chip: #232322; --chip-hover: #2c2c2a; --ink: #f1f1ee; --ink-text: #141414;
  --accent: #7c9cff; --accent-soft: rgba(124,156,255,.16); --danger: #ff8a73;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.35);
  --pop-shadow: 0 2px 6px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
  min-height: 100vh; display: flex; justify-content: center; padding: 14vh 16px 60px;
}
main { width: 100%; max-width: 760px; }

.summary { display: flex; gap: 12px; align-items: baseline; color: var(--muted); font-size: 20px; margin: 0 8px 18px; min-height: 30px; }
.summary .icon { font-size: 22px; }
.summary.loading .text { opacity: .45; }

.card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: 26px 28px 16px; position: relative; }
.field { position: relative; }
.field-text, textarea {
  font: inherit; font-size: 22px; line-height: 1.6; letter-spacing: 0;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; padding: 0; margin: 0; border: 0;
}
.backdrop { position: absolute; inset: 0; color: var(--text); pointer-events: none; }
textarea {
  position: relative; display: block; width: 100%; min-height: 1.6em; resize: none; overflow: hidden;
  background: transparent; color: transparent; caret-color: var(--text); outline: none;
}
textarea::placeholder { color: var(--faint); }
textarea::selection { background: var(--accent-soft); color: transparent; }
mark {
  background: transparent; color: inherit; border-radius: 4px;
  text-decoration: underline dotted var(--muted); text-decoration-thickness: 2px; text-underline-offset: 6px;
  transition: background .15s;
}
mark.settled { text-decoration: underline solid var(--accent); text-decoration-thickness: 1.5px; }
/* a question the request asks: answer it in place */
mark.ask:not(.settled) { text-decoration: underline wavy var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
mark.hover, mark.active { background: var(--chip-hover); }
mark.flash { animation: flash .7s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
textarea.on-mark { cursor: pointer; }
/* open-question placeholders: "My budget is [budget]." */
mark.ph { color: var(--accent); background: var(--accent-soft); text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; }
mark.ph.hover, mark.ph.active { background: color-mix(in srgb, var(--accent) 24%, transparent); }

/* extras */
.extras { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-top: 14px; min-height: 0; }
.extras:empty { display: none; }
.token {
  background: none; border: 0; padding: 2px 4px; margin: 0 -4px; border-radius: 6px; font: inherit; font-size: 16px; color: var(--text); cursor: pointer;
  text-decoration: underline dotted var(--muted); text-decoration-thickness: 2px; text-underline-offset: 6px;
}
.token:hover, .token.active { background: var(--chip-hover); }
.token .k { color: var(--muted); }
.token.unset .v { color: var(--faint); }
.token.settled { text-decoration: underline solid var(--accent); text-decoration-thickness: 1.5px; }

/* scrubbable numbers */
mark.scrub { color: var(--accent); text-decoration: underline dashed var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 6px; }
mark.scrub.settled { text-decoration-style: solid; }
mark.scrubbing, .token.scrubbing { background: var(--accent-soft); }
textarea.on-scrub { cursor: ew-resize; }
.token.scrub { cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; text-decoration: underline dashed var(--accent); text-decoration-thickness: 1.5px; }
.token.scrub.settled { text-decoration-style: solid; }
.token.scrub .v { color: var(--accent); font-variant-numeric: tabular-nums; }
.token.scrub.unset .v { color: var(--muted); }
.token:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.scrubbing, body.scrubbing * { cursor: ew-resize !important; user-select: none !important; -webkit-user-select: none !important; }
.scrub-hint { position: fixed; z-index: 11; pointer-events: none; transform: translate(-50%, calc(-100% - 8px)); font-size: 12px; line-height: 1.3; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; box-shadow: var(--shadow); white-space: nowrap; }
.scrub-hint[hidden] { display: none; }
.scrub-hint b { color: var(--text); font-weight: 600; }
.add-more { white-space: nowrap; font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 0; }
.add-more:hover { color: var(--text); }
.add-more:disabled { opacity: .6; cursor: default; animation: shimmer 1.2s infinite ease-in-out; }
.add-more[hidden] { display: none; }
.ph-sample { color: var(--accent); background: var(--accent-soft); border-radius: 4px; }

.toolbar { display: flex; align-items: center; gap: 14px; margin-top: 16px; min-height: 48px; }
.status { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.status.busy .dot { background: var(--accent); animation: pulse 1s infinite ease-in-out; }
.status.err { color: var(--danger); }
.status.err .dot { background: var(--danger); }
.status button { font: inherit; color: inherit; background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }
@keyframes shimmer { 50% { opacity: .5; } }
.spacer { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 20px; flex: none; }
.icon-btn:hover { background: var(--chip-hover); color: var(--text); }
.send { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; background: var(--ink); color: var(--ink-text); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .3; cursor: default; }
.send svg { width: 22px; height: 22px; }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 22px; }
.hint kbd { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--card); }

/* popover */
.pop { position: fixed; z-index: 10; width: min(420px, calc(100vw - 32px)); background: var(--card); border-radius: 22px; box-shadow: var(--pop-shadow); padding: 18px 18px 12px; border: 1px solid var(--line); max-height: calc(100vh - 24px); overflow: auto; }
.pop[hidden] { display: none; }
.pop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 2px 4px 12px; }
.pop-q { color: var(--muted); font-size: 16px; }
.pop-kind { font-size: 12px; color: var(--faint); white-space: nowrap; }
.pop-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding: 0 4px; font-size: 13px; color: var(--muted); }
.pop-foot button { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; }
.pop-foot button:hover { color: var(--text); }
.pop-tools { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; }
.pop .pop-tools .explain-btn { color: var(--accent); }
.pop-note { margin-top: 10px; padding: 0 4px; font-size: 13px; color: var(--muted); }
.explain-btn { font: inherit; font-size: 13px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.explain-btn:hover { text-decoration: underline; }
.explain { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; margin: -2px 0 12px; font-size: 14px; line-height: 1.5; }
.explain p { margin: 0 0 8px; }
.explain ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.explain li b { font-weight: 600; }
.explain.loading { color: var(--muted); animation: shimmer 1.2s infinite ease-in-out; }
.explain.err { color: var(--danger); background: none; padding: 0; }

/* expanded explanation */
.pop.wide { width: min(780px, calc(100vw - 32px)); padding: 22px 22px 14px; }
.pop.wide .pop-q { font-size: 18px; color: var(--text); }
.pop.wide .explain { font-size: 15px; margin-bottom: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px; }
.ocard {
  position: relative; display: flex; flex-direction: column; text-align: left; font: inherit; color: var(--text);
  background: var(--chip); border: 1.5px solid var(--line); border-radius: 16px; padding: 0; overflow: hidden; cursor: pointer;
  transition: border-color .12s, background .12s, box-shadow .12s;
}
.ocard:hover { border-color: var(--faint); background: var(--chip-hover); }
.ocard.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ocard.static { cursor: default; }
.ocard.static:hover { border-color: var(--line); background: var(--chip); }
.ocard .pic { display: block; aspect-ratio: 16 / 10; background: var(--chip-hover); overflow: hidden; }
.ocard .pic.loading { animation: shimmer 1.2s infinite ease-in-out; }
.ocard .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ocard .body { padding: 12px 14px 14px; display: grid; gap: 4px; }
.ocard .name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; padding-right: 22px; }
.ocard .name .emo { font-size: 18px; line-height: 1; }
.ocard .what { font-size: 14px; line-height: 1.45; }
.ocard .for { font-size: 13px; color: var(--muted); }
.ocard .tick {
  position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--faint); background: var(--card); font-size: 13px; color: transparent;
}
.ocard.multi .tick { border-radius: 6px; }
.ocard.on .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
.ocard .credit { position: absolute; left: 8px; top: 8px; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; text-decoration: none; opacity: 0; transition: opacity .12s; }
.ocard:hover .credit { opacity: 1; }
/* help me decide */
.ocard.rec:not(.on) { border-color: var(--accent); border-style: dashed; }
.ocard .badge { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-bottom: 2px; }
.decide-start { font: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px 8px 13px; margin: 2px 0 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--text); cursor: pointer; }
.decide-start:hover { background: var(--chip-hover); }
.decide { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 0 0 12px; display: grid; gap: 14px; }
.decide-head { display: flex; align-items: baseline; gap: 12px; font-size: 13px; color: var(--muted); }
.decide-head b { flex: 1; font-size: 15px; font-weight: 600; color: var(--text); }
.decide-head button { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; }
.decide-head button:hover { color: var(--text); }
.dq { display: grid; gap: 8px; }
.dq-q { font-size: 15px; }
.dq .chip { padding: 6px 13px 6px 11px; font-size: 14px; gap: 7px; }
.decide-rec { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.decide-rec span { flex: 1 1 260px; }
.decide-rec button { font: inherit; font-size: 14px; font-weight: 600; background: var(--ink); color: var(--ink-text); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.decide-rec button:disabled { opacity: .45; cursor: default; }
.decide-busy { font-size: 14px; color: var(--muted); animation: shimmer 1.2s infinite ease-in-out; }
.decide-err { font-size: 14px; color: var(--danger); }
.cards.skeleton .ocard { height: 120px; animation: shimmer 1.2s infinite ease-in-out; cursor: default; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 9px; padding: 8px 16px 8px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--chip); color: var(--text); font: inherit; font-size: 15px; cursor: pointer;
  transition: background .12s, color .12s; text-align: left;
}
.chip:hover { background: var(--chip-hover); }
.chip.on { background: var(--ink); color: var(--ink-text); border-color: var(--ink); }
.chip .emo { font-size: 17px; line-height: 1; }
.chip.other { color: var(--muted); }
.other-input { font: inherit; font-size: 15px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--accent); background: var(--chip); color: var(--text); outline: none; min-width: 0; flex: 1 1 200px; }
.slider-val { font-size: 22px; font-weight: 600; text-align: center; margin: 0 0 6px; min-height: 33px; }
.slider-val.unset { color: var(--faint); font-weight: 400; font-size: 16px; padding-top: 6px; }
input[type=range] { width: 100%; accent-color: var(--ink); }
.slider-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.done { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 88%, transparent); z-index: 20; padding: 16px; }
.done[hidden] { display: none; }
.done-box { background: var(--card); border-radius: 24px; box-shadow: var(--pop-shadow); padding: 28px; max-width: 560px; width: 100%; }
.done-box h2 { margin: 0 0 6px; font-size: 20px; }
.done-box p { margin: 0 0 14px; color: var(--muted); }
.done-box pre { white-space: pre-wrap; background: var(--bg); border-radius: 14px; padding: 14px 16px; margin: 0; font: inherit; font-size: 15px; max-height: 50vh; overflow: auto; }

@media (max-width: 560px) {
  body { padding-top: 6vh; }
  .card { padding: 20px 18px 12px; border-radius: 22px; }
  .field-text, textarea { font-size: 19px; }
  .summary { font-size: 17px; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <div class="summary" id="summary"><span class="icon">✳️</span><span class="text" id="summaryText">Reading your request…</span></div>

  <div class="card">
    <div class="field">
      <div class="backdrop field-text" id="backdrop" aria-hidden="true"></div>
      <textarea id="ta" rows="1" spellcheck="false" placeholder="What do you need help with?" aria-label="Your request"></textarea>
    </div>
    <div class="extras" id="extras"></div>
    <div class="toolbar">
      <button class="icon-btn" id="cancel" title="Cancel and send nothing back" aria-label="Cancel">✕</button>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">idle</span></span>
      <span class="spacer"></span>
      <button class="add-more" id="more" hidden>+ More questions</button>
      <button class="send" id="send" title="Send to your agent (Enter)" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="hint" id="hint">Click an underline to flip it, or drag a blue value. Unfilled <span class="ph-sample">[blanks]</span> are dropped when you send. <kbd>Enter</kbd> sends to <span class="agentName">your agent</span>, <kbd>Shift</kbd>+<kbd>Enter</kbd> adds a line.</div>
</main>

<div class="pop" id="pop" hidden role="dialog"></div>
<div class="scrub-hint" id="scrubHint" hidden></div>
<div class="done" id="done" hidden>
  <div class="done-box">
    <h2 id="doneTitle">Sent to <span class="agentName">your agent</span></h2>
    <p id="doneSub">You can close this tab.</p>
    <pre id="donePrompt"></pre>
  </div>
</div>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const ta = $("ta"), backdrop = $("backdrop"), pop = $("pop"), extrasEl = $("extras");
const EXAMPLE = "Help me choose a coffee machine for my small kitchen, something good for lattes. Should I get a grinder too?";

let mode = "live", modelName = "the model", agentName = "your agent", imagesOn = true;
let choices = [];            // inline (span in the text) and extras (span "", shown as tokens)
let summary = "";
let seq = 0, timer = null, lastAnalyzed = null, busy = false, moreBusy = false;
let openId = null, hoverId = null, uid = 0;
const dismissed = new Set(); // questions whose sentence you removed: don't ask them again

// ------------------------------------------------------------ choice model
function makeChoice(c) {
  const ch = {
    id: "c" + (++uid), span: c.span || "", question: c.question || "Choose", kind: c.kind || "multi",
    token: c.token || "", sentence: c.sentence || "", promo: null, statement: c.span ? c.statement || "" : "", options: (c.options || []).filter(o => o && o.label && o.text),
    selected: [], custom: "", slider: c.slider || null, value: null, touched: false,
    orig: c.span || "", cur: c.span || "", start: -1, end: -1, settled: false, extra: !c.span,
    explain: !!c.explain, explanation: null, explainOpen: false, explainBusy: false, explainErr: "",
  };
  if (ch.extra && !ch.token) ch.token = ch.question.replace(/^(what('s| is)|how|which|do you|any)\s+/i, "").replace(/\?$/, "");
  const cur = new Set((c.current || []).map(s => s.toLowerCase()));
  ch.selected = ch.options.filter(o => cur.has(o.label.toLowerCase())).map(o => o.label);
  if (ch.extra && ch.selected.length) ch.settled = true;
  if (ch.kind === "slider") {
    const s = ch.slider || (ch.slider = {});
    if (Array.isArray(s.stops) && s.stops.length) { s.min = 0; s.max = s.stops.length - 1; s.step = 1; }
    s.min ??= 0; s.max ??= 10; s.step ??= 1;
    ch.value = clamp(s.value ?? Math.round((s.min + s.max) / 2), s.min, s.max);
    if (!s.stops) { const n = numberIn(ch.span); if (n !== null && n >= s.min && n <= s.max) ch.value = s.value = n; }
  }
  if (ch.kind !== "slider" && !ch.options.length) return null;
  return ch;
}
const WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
function numberIn(t) {
  const m = t.match(/\d+(\.\d+)?/); if (m) return Number(m[0]);
  for (const x of t.toLowerCase().match(/[a-z]+/g) || []) { const i = WORDS.indexOf(x); if (i >= 0) return i; }
  return null;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmtNum = (v) => (Number.isInteger(v) ? v : Math.round(v * 100) / 100).toLocaleString();

// A question in the request ("What do I do with the water heater?") becomes its statement once answered
// ("With the water heater, I'll repair it."), and goes back to the question when cleared.
function textFor(ch) {
  if (!ch.statement) return valueFor(ch);
  if (!isSet(ch)) return ch.orig;
  let t = ch.statement.trim();
  if (!t.includes("{value}")) t = t.replace(/[.!?]?$/, ": {value}.");
  return t.replace("{value}", valueFor(ch)).replaceAll("{value}", "");
}
function valueFor(ch) {
  if (ch.kind === "slider") {
    const s = ch.slider;
    if (s.stops && s.stops.length) return s.stops[Math.round(ch.value)] ?? ch.orig;
    const v = fmtNum(ch.value);
    if (s.template && s.template.includes("{value}")) return s.template.replaceAll("{value}", v);
    return v + (s.unit ? " " + s.unit : "");
  }
  const parts = ch.options.filter(o => ch.selected.includes(o.label)).map(o => o.text);
  if (ch.custom) parts.push(ch.custom);
  if (!parts.length) return ch.extra || ch.promo ? "" : ch.orig;
  return parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " and " + parts.at(-1);
}
function tokenValue(ch) {
  if (!ch.settled) return "";
  if (ch.kind === "slider") return textFor(ch);
  return [...ch.options.filter(o => ch.selected.includes(o.label)).map(o => o.label), ch.custom].filter(Boolean).join(", ");
}

// ------------------------------------------------------------ inline phrases <-> text
const overlaps = (ranges, a, b) => ranges.some(([s, e]) => a < e && b > s);
function relocate(text) {
  const taken = [];
  choices = choices.filter(ch => {
    if (ch.extra) return true;
    let best = -1, bestD = Infinity, i = text.indexOf(ch.cur);

      ? (ch.slider.stops?.length ? ch.slider.stops : [ch.slider.minLabel || String(ch.slider.min), ch.slider.maxLabel || String(ch.slider.max)])
      : ch.options.map(o => o.label);
    try {
      ch.explanation = mode === "live"
        ? await post("/api/explain", { text: ta.value, question: ch.question, options: opts })
        : await demoExplain(ch, opts);
    } catch (e) { if (!e.superseded) ch.explainErr = e.message; }
    ch.explainBusy = false;
  }
  if (ch.explainOpen) loadImages(ch);
  refresh();
}

function anchorFor(id) {
  return backdrop.querySelector(`mark[data-id="${id}"]`) || extrasEl.querySelector(`[data-id="${id}"]`);
}
function positionPop() {
  const a = anchorFor(openId); if (!a) return;
  if (pop.classList.contains("wide")) {
    // the expanded panel sits under the whole request card so the sentence stays readable while you pick
    const c = document.querySelector(".card").getBoundingClientRect(), pw = pop.offsetWidth;
    const top = c.bottom + 10, room = innerHeight - top - 12;
    if (room >= 320) {
      pop.style.left = clamp(c.left + (c.width - pw) / 2, 16, innerWidth - pw - 16) + "px";
      pop.style.top = top + "px"; pop.style.maxHeight = room + "px";
      return;
    }
  }
  pop.style.maxHeight = ""; // CSS default: viewport minus a margin, scrolls inside
  const rs = a.getClientRects(); const r = rs[rs.length - 1] || a.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let top = r.bottom + 10;
  if (top + ph > innerHeight - 12) top = r.top - ph - 10 > 12 ? r.top - ph - 10 : innerHeight - ph - 12; // no room either side: keep it on screen
  pop.style.left = clamp(r.left - 12, 16, innerWidth - pw - 16) + "px"; pop.style.top = Math.max(12, top) + "px";
}
function closePop() { if (!openId) return; openId = null; openedFor = null; pop.hidden = true; render(); }

function refreshChoice(ch) {
  if (openId === ch.id) openPop(ch.id);
}
const moreBtn = $("more");
moreBtn.onclick = () => analyze({ more: true });
function renderMore() {
  moreBtn.hidden = !lastAnalyzed;
  moreBtn.disabled = moreBusy;
  moreBtn.textContent = moreBusy ? "Thinking of more…" : "+ More questions";
}

// ------------------------------------------------------------ hit testing (marks sit under the textarea)
function markAt(x, y) {
  for (const m of backdrop.querySelectorAll("mark"))
    for (const r of m.getClientRects()) if (x >= r.left && x <= r.right && y >= r.top - 2 && y <= r.bottom + 4) return m.dataset.id;
  return null;
}
ta.addEventListener("mousemove", (e) => {
  if (drag) return;
  const id = markAt(e.clientX, e.clientY);
  if (id !== hoverId) {
    hoverId = id; const ch = byId(id);
    ta.classList.toggle("on-mark", !!id); ta.classList.toggle("on-scrub", isScrub(ch));
    backdrop.querySelectorAll("mark").forEach(m => m.classList.toggle("hover", m.dataset.id === id));
    isScrub(ch) ? showHint(ch) : hideHint();
  }
});
ta.addEventListener("mouseleave", () => { hoverId = null; ta.classList.remove("on-mark", "on-scrub"); hideHint(); backdrop.querySelectorAll("mark.hover").forEach(m => m.classList.remove("hover")); });
ta.addEventListener("mouseup", (e) => {
  if (performance.now() - lastScrubEnd < 400) return; // a scrub just handled this press
  if (ta.selectionStart !== ta.selectionEnd) return;
  const id = markAt(e.clientX, e.clientY);
  if (id) { id === openId ? closePop() : openPop(id); } else closePop();
});
extrasEl.addEventListener("click", (e) => {
  const b = e.target.closest(".token"); if (!b) return;
  if (performance.now() - lastScrubEnd < 400) return; // pointerup already opened (or scrubbed) it
  b.dataset.id === openId ? closePop() : openPop(b.dataset.id);
});
document.addEventListener("mousedown", (e) => {
  if (openId && !pop.contains(e.target) && e.target !== ta && !extrasEl.contains(e.target)) closePop();
});
addEventListener("resize", () => openId && positionPop());
addEventListener("scroll", (e) => { if (pop.contains(e.target)) return; hideHint(); if (openId) positionPop(); }, true);

// ------------------------------------------------------------ scrubbable numbers
// A press without movement opens the popover instead.
let drag = null, lastScrubEnd = 0;
const hintEl = $("scrubHint");
const byId = (id) => id ? choices.find(c => c.id === id) : null;
const isScrub = (ch) => !!ch && ch.kind === "slider";
function pxPerStep(ch) {
  const s = ch.slider, n = Math.max(1, (s.max - s.min) / s.step);
  return clamp(280 / n, 4, 40); // whole range in ~280px, but never too twitchy or too sluggish
}
function scrubTo(ch, v) {
  const s = ch.slider;
  const n = Math.round((clamp(v, s.min, s.max) - s.min) / s.step);
  const next = clamp(+(s.min + n * s.step).toFixed(6), s.min, s.max);
  if (next === ch.value && ch.touched) return;
  ch.value = next; ch.touched = true; applyChoice(ch);
}
function showHint(ch, html) {
  const a = anchorFor(ch.id); if (!a) return hideHint();
  const rs = a.getClientRects(), r = rs[0] || a.getBoundingClientRect();
  hintEl.innerHTML = html || `<b>⟷</b> drag to change · click for more`;
  hintEl.hidden = false;
  hintEl.style.left = clamp(r.left + r.width / 2, 90, innerWidth - 90) + "px";
  hintEl.style.top = r.top + "px";
}
function hideHint() { hintEl.hidden = true; }
function startScrub(ch, e) {
  if (openId) closePop();
  drag = { id: ch.id, x0: e.clientX, v0: ch.value, moved: false };
  hideHint();
}
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const ch = byId(drag.id); if (!ch) { drag = null; return; }
  const dx = e.clientX - drag.x0;
  if (!drag.moved) {
    if (Math.abs(dx) < 4) return;
    drag.moved = true; document.body.classList.add("scrubbing");
  }
  scrubTo(ch, drag.v0 + Math.round(dx / pxPerStep(ch)) * ch.slider.step);
});
function endScrub(cancelled) {
  if (!drag) return;
  const d = drag, ch = byId(d.id); drag = null;
  document.body.classList.remove("scrubbing");
  lastScrubEnd = performance.now();
  if (!ch) return;
  if (!d.moved && !cancelled) openPop(ch.id); // click fallback
  else render();
}
document.addEventListener("pointerup", () => endScrub(false));
document.addEventListener("pointercancel", () => endScrub(true));

// inline values live under the textarea, so hit-test there
ta.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const ch = byId(markAt(e.clientX, e.clientY));
  if (!isScrub(ch)) return;
  e.preventDefault(); startScrub(ch, e);
});
ta.addEventListener("mousedown", (e) => { if (isScrub(byId(markAt(e.clientX, e.clientY)))) e.preventDefault(); });
ta.addEventListener("touchstart", (e) => { // stop the page from scrolling while a finger scrubs
  const t = e.touches[0]; if (t && isScrub(byId(markAt(t.clientX, t.clientY)))) e.preventDefault();
}, { passive: false });

// tokens under the request
extrasEl.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".token.scrub"); if (!b || e.button !== 0) return;
  e.preventDefault(); b.focus(); startScrub(byId(b.dataset.id), e);
});
extrasEl.addEventListener("pointerover", (e) => {
  const b = e.target.closest(".token.scrub"); if (b && !drag) showHint(byId(b.dataset.id));
});
extrasEl.addEventListener("pointerout", (e) => {
  if (e.target.closest(".token.scrub") && !e.relatedTarget?.closest?.(".token.scrub")) hideHint();
});

// keyboard: arrows nudge (Shift = x10), Home/End jump
function scrubKey(ch, e) {
  const s = ch.slider, big = e.shiftKey ? 10 : 1;
  const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
  if (d) scrubTo(ch, ch.value + d * big * s.step);
  else if (e.key === "Home") scrubTo(ch, s.min);
  else if (e.key === "End") scrubTo(ch, s.max);
  else return false;
  e.preventDefault(); return true;
}
extrasEl.addEventListener("keydown", (e) => {
  const b = e.target.closest(".token.scrub"); if (!b) return;
  const ch = byId(b.dataset.id); if (ch) { hideHint(); scrubKey(ch, e); }
});
// in the text: put the caret on a blue value and use Alt+Left/Right
ta.addEventListener("keydown", (e) => {
  if (!e.altKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  const p = ta.selectionStart, ch = choices.find(c => !c.extra && c.kind === "slider" && p >= c.start && p <= c.end);
  if (ch && scrubKey(ch, e)) ta.setSelectionRange(ch.end, ch.end);
});

// ------------------------------------------------------------ analysis
function schedule(ms = 700) { clearTimeout(timer); timer = setTimeout(() => analyze(), ms); }

async function analyze({ more = false } = {}) {
  const text = ta.value;
  if (!more && text === lastAnalyzed) return;
  if (!text.trim()) { setStatus("", "waiting for a request"); return; }
  const my = more ? seq : ++seq;
  if (more) moreBusy = true; else busy = true;
  render();
  setStatus("busy", more ? `${esc(modelName)} is looking for more…` : `${esc(modelName)} is reading…`);
  const extras = choices.filter(c => c.extra);
  const payload = {
    text: withoutOpen(text), more,
    settled: choices.filter(c => !c.extra && c.settled).map(c => c.cur),
    answers: extras.filter(c => c.settled).map(c => `${c.token}: ${textFor(c)}`),
    asked: [...extras, ...choices.filter(c => c.promo)].map(c => c.question).concat([...dismissed]),
  };
  let data;
  try {
    data = mode === "live" ? await post("/api/analyze", payload) : await demoAnalyze(text, more);
  } catch (e) {
    if (more) { moreBusy = false; render(); }
    if (my !== seq || e.superseded) return;
    busy = false; render();
    setStatus("err", `couldn't analyse: ${esc(e.message)} · <button id="retry">retry</button>`);
    $("retry").onclick = () => { lastAnalyzed = null; analyze({ more }); };
    return;
  }
  if (more) moreBusy = false; else busy = false;
  if (my !== seq || ta.value !== text) { render(); return; }
  if (!more) lastAnalyzed = text;
  merge(text, data, more);
  const n = choices.filter(c => !c.settled).length;
  setStatus("", `${n} thing${n === 1 ? "" : "s"} to flip · ${esc(data.model || modelName)}${data.ms ? ` ${(data.ms / 1000).toFixed(1)}s` : ""}${mode === "demo" ? " (demo)" : ""}`);
}

function merge(text, data, more) {
  if (!more && data.summary) summary = data.summary;
  // a fresh read keeps what you've set and replaces the rest; "+ more" only adds extras
  const kept = more ? choices : choices.filter(c => c.settled || c.promo);
  const seen = new Set([...dismissed, ...kept.filter(c => c.extra || c.promo).flatMap(c => [c.question.toLowerCase(), c.token.toLowerCase()])]);
  const taken = kept.filter(c => !c.extra).map(c => c.promo ? sentenceRange(c, text) : [c.start, c.end]);
  const fresh = [];
  for (const raw of data.choices || []) {
    const ch = makeChoice(raw); if (!ch) continue;
    if (ch.extra) {
      if (seen.has(ch.question.toLowerCase()) || seen.has(ch.token.toLowerCase())) continue;
      seen.add(ch.question.toLowerCase()); seen.add(ch.token.toLowerCase()); fresh.push(ch); continue;
    }
    if (more) continue;
    let i = text.indexOf(ch.span);
    if (i < 0) { const j = text.toLowerCase().indexOf(ch.span.toLowerCase()); if (j < 0) continue; i = j; ch.span = ch.orig = ch.cur = text.slice(j, j + ch.span.length); }
    while (i >= 0 && overlaps(taken, i, i + ch.span.length)) i = text.indexOf(ch.span, i + 1);
    if (i < 0) continue;
    ch.start = i; ch.end = i + ch.span.length; taken.push([ch.start, ch.end]);
    fresh.push(ch);
  }
  if (openId && !kept.some(k => k.id === openId)) closePop();
  choices = [...kept, ...fresh];
  // already-answered extras stay as tokens under the request
  for (const ch of fresh) if (ch.extra && !ch.settled) promote(ch);
  if (fresh.some(c => c.promo)) lastAnalyzed = more ? lastAnalyzed : ta.value;
  render();
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 409) throw Object.assign(new Error("superseded"), { superseded: true });
  // 404: an older server process is answering a newer page.
  if (r.status === 404) throw new Error("the running server is older than this page. Run /help-me again to restart it");
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ------------------------------------------------------------ editing & keys
ta.addEventListener("input", () => {
  relocate(ta.value); render();
  if (ta.value !== skipNextAnalysisFor) schedule();
});
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  else if (e.key === "ArrowDown" && e.altKey) {
    const p = ta.selectionStart, c = choices.find(c => !c.extra && p >= c.start && p <= c.end);
    if (c) { e.preventDefault(); openPop(c.id); }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openId) { closePop(); ta.focus(); return; }
  if (e.key === "Enter" && !e.shiftKey && e.target === document.body) { e.preventDefault(); submit(); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target !== ta) { e.preventDefault(); submit(); }
});

// ------------------------------------------------------------ send / cancel
function compose() {
  let out = withoutOpen();
  const set = choices.filter(c => c.extra && c.settled);
  if (set.length) out += "\n\n" + set.map(c => `- ${c.token}: ${textFor(c)}`).join("\n");
  return out;
}
$("send").onclick = submit;
async function submit() {
  if (!withoutOpen()) return;
  closePop();
  const prompt = compose();
  $("donePrompt").textContent = prompt;
  if (mode === "live") {
    try { await post("/api/submit", { prompt }); }
    catch (e) { setStatus("err", "couldn't reach the help-me server: " + esc(e.message)); return; }
  } else {
    try { await navigator.clipboard.writeText(prompt); } catch {}
    $("doneTitle").textContent = "Copied to clipboard";
    $("doneSub").textContent = "Demo mode. Paste this into your agent:";
  }
  $("done").hidden = false;
}
$("cancel").onclick = async () => {
  if (mode === "live") { try { await post("/api/cancel", {}); } catch {} }
  $("doneTitle").textContent = "Cancelled";
  $("doneSub").textContent = `Nothing was sent to ${agentName}. You can close this tab.`;
  $("donePrompt").textContent = ta.value;
  $("done").hidden = false;
};

// ------------------------------------------------------------ demo (opened as a plain file)
async function demoAnalyze(text, more) {
  await new Promise(r => setTimeout(r, 600));
  if (more) return { model: "demo", choices: [
    { span: "", token: "Looks", sentence: "I like a {value} look.", question: "What look do you want?", kind: "multi", options: [
      { label: "Classic steel", emoji: "🪞", text: "classic brushed steel" }, { label: "Retro", emoji: "📻", text: "retro" }, { label: "Matte black", emoji: "🖤", text: "matte black" } ] } ] };
  const all = [
    { span: "Should I get a grinder too?", statement: "I'd also like {value}.", question: "Get a grinder too?", kind: "single", explain: true, options: [
      { label: "Built-in grinder", emoji: "⚙️", text: "a machine with a built-in grinder" }, { label: "Separate grinder", emoji: "🫘", text: "a separate burr grinder" },
      { label: "No grinder", emoji: "🚫", text: "to keep using pre-ground coffee" } ] },
    { span: "coffee machine", question: "What kind of machine?", kind: "single", explain: true, options: [
      { label: "Espresso", emoji: "☕", text: "espresso machine" }, { label: "Bean-to-cup", emoji: "🫘", text: "bean-to-cup machine" },
      { label: "Pod", emoji: "💊", text: "pod machine" }, { label: "Filter", emoji: "🫗", text: "filter coffee machine" } ] },
    { span: "small", question: "How small is the space?", kind: "slider", explain: true, slider: { stops: ["tiny", "small", "average-sized"], value: 1, minLabel: "tiny", maxLabel: "roomy" } },
    { span: "lattes", question: "Which drinks?", kind: "multi", options: [
      { label: "Lattes", emoji: "🥛", text: "lattes" }, { label: "Cappuccinos", emoji: "☁️", text: "cappuccinos" },
      { label: "Espresso", emoji: "☕", text: "espresso" }, { label: "Flat whites", emoji: "🤍", text: "flat whites" } ], current: ["Lattes"] },
    { span: "", token: "Budget", sentence: "My budget is {value}.", question: "What's your budget?", kind: "slider", slider: { min: 50, max: 1500, step: 50, value: 400, template: "up to €{value}", minLabel: "€50", maxLabel: "€1,500" } },
    { span: "", token: "Milk", sentence: "For milk I'd like {value}.", question: "How should it froth milk?", kind: "single", explain: true, options: [
      { label: "Automatic", emoji: "🤖", text: "automatic frothing" }, { label: "Steam wand", emoji: "♨️", text: "a manual steam wand" }, { label: "Separate frother", emoji: "🥄", text: "a separate frother" } ] },
    { span: "", token: "Cups", sentence: "I drink about {value}.", question: "How many cups a day?", kind: "slider", slider: { min: 1, max: 8, step: 1, value: 2, template: "{value} cups a day" } },
  ];
  return { summary: "Let's pin down which coffee machine fits your kitchen and your lattes.", model: "demo",
    choices: all.filter(c => !c.span || text.includes(c.span)) };
}
async function demoExplain(ch, opts) {
  await new Promise(r => setTimeout(r, 500));
  if (ch.question === "What kind of machine?") return {
    intro: "This is the biggest fork: it decides how much effort each cup takes and how good the coffee can get.",
    options: [
      { label: "Espresso", what: "You grind, tamp and steam yourself. Best drinks, but it takes practice.", good_for: "hobbyists who enjoy the ritual", image: "espresso machine portafilter" },
      { label: "Bean-to-cup", what: "Grinds and brews at the push of a button. Convenient, pricier, bulkier.", good_for: "busy mornings, several drinkers", image: "bean to cup coffee machine" },
      { label: "Pod", what: "Cheap and tidy, but each cup costs more and the taste is limited.", good_for: "one quick cup a day", image: "coffee capsule machine" },
      { label: "Filter", what: "Brews a jug of milder coffee. No lattes without a separate frother.", good_for: "black coffee by the mug", image: "drip coffee maker" } ] };
  if (ch.question === "How should it froth milk?") return {
    intro: "Lattes need steamed milk. How the machine does it decides how much skill it takes and how silky the foam gets.",
    options: [
      { label: "Automatic", what: "Press a button and it froths for you. Easy, consistent, a bit more to clean.", good_for: "beginners and quick lattes" },
      { label: "Steam wand", what: "You steam the milk yourself. Silkiest foam once you learn, latte art possible.", good_for: "people who want café-style milk" },
      { label: "Separate frother", what: "A small jug that heats and whips milk on its own. Cheap, foam is airier.", good_for: "pod or filter machines" } ] };
  return { intro: "This changes which machines fit you.", options: opts.map(l => ({ label: l, what: "A reasonable choice; it depends on your taste." })) };
}

async function demoDecide(ch, { options, answers, asked }) {
  await new Promise(r => setTimeout(r, 500));
  const machine = ch.question === "What kind of machine?";
  const bank = machine ? [
    { question: "How often will you make milk drinks?", options: [
      { label: "Every day", emoji: "🥛", fav: "Espresso" }, { label: "A few times a week", emoji: "📅", fav: "Bean-to-cup" }, { label: "Rarely", emoji: "🫗", fav: "Filter" } ] },
    { question: "How much fiddling do you enjoy?", options: [
      { label: "Love the ritual", emoji: "🧪", fav: "Espresso" }, { label: "Some is fine", emoji: "👌", fav: "Bean-to-cup" }, { label: "One button please", emoji: "🔘", fav: "Pod" } ] },
    { question: "Rough budget?", options: [
      { label: "Under €150", emoji: "🪙", fav: "Pod" }, { label: "€150–600", emoji: "💶", fav: "Espresso" }, { label: "€600+", emoji: "💎", fav: "Bean-to-cup" } ] },
  ] : [
    { question: "How much time do you have in the morning?", options: options.map((l, i) => ({ label: ["Seconds", "A few minutes", "No rush"][i % 3], fav: l })) },
    { question: "What matters most?", options: options.map((l, i) => ({ label: ["Ease", "Quality", "Price"][i % 3], fav: l })) },
  ];
  const fresh = bank.filter(q => !asked.includes(q.question));
  if (!answers.length) return { model: "demo", questions: fresh };
  const votes = {};
  for (const a of answers) { const o = bank.find(q => q.question === a.q)?.options.find(o => o.label === a.a); if (o) votes[o.fav] = (votes[o.fav] || 0) + 1; }
  const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0]?.[0];
  return { model: "demo", questions: [], recommendation: best && {
    label: best, why: `From what you said (${answers.map(a => a.a.toLowerCase()).join(", ")}), ${best.toLowerCase()} fits you best.` } };
}

// ------------------------------------------------------------ boot
(async () => {
  try {
    if (location.protocol === "file:") throw 0;
    const r = await fetch("/api/init"); if (!r.ok) throw 0;
    const j = await r.json(); modelName = j.model || "the model"; agentName = j.agent || "your agent";
    document.querySelectorAll(".agentName").forEach((el, i) => el.textContent = i === 2 ? agentName.replace(/^./, (c) => c.toUpperCase()) : agentName);
    $("send").title = `Send to ${agentName} (Enter)`; ta.value = j.draft || ""; imagesOn = j.images !== false;
  } catch {
    mode = "demo"; modelName = "demo"; ta.value = EXAMPLE;
    $("hint").innerHTML = "Demo mode: canned underlines, since this page wasn't opened by <code>/help-me</code>.";
  }
  render(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  if (ta.value.trim()) analyze(); else { setStatus("", "waiting for a request"); render(); }
})();
})();
