name: Harness CLIs

# Installs the real harness CLIs and checks that help-me still finds them and calls them with flags they know.
# No model is called and nothing is logged in, so it needs no secrets. It runs on a PR only when the code it covers
# changes (test/boundaries.test.ts fails if providers.ts starts importing a file missing from `paths`) or a pinned CLI
# is bumped, weekly for Antigravity (its installer has no version to pin), and by hand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - skills/help-me/providers.ts
      - skills/help-me/providers/**
      - skills/help-me/schema.ts
      - test/harnesses/**
      - .github/workflows/harnesses.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: ${{ matrix.harness }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
          - harness: codex
          - harness: antigravity
          - harness: opencode
          - harness: pi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # Pinned here so CI runs the exact version a PR reviewed; Renovate bumps each version a week after its release
      # (renovate.json reads the `# renovate:` comments), so a CLI that changed its flags shows up on the bump's PR.
      # Only the CLI is pinned, not what it depends on: this job checks detection and flags, nothing else.
      - name: Install claude
        if: matrix.harness == 'claude'
        # renovate: datasource=npm depName=@anthropic-ai/claude-code
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.330
      - name: Install codex
        if: matrix.harness == 'codex'
        # renovate: datasource=npm depName=@openai/codex
        run: npm install --global --no-audit --no-fund @openai/codex@0.171.0
      - name: Install opencode
        if: matrix.harness == 'opencode'
        # renovate: datasource=npm depName=opencode-ai
        run: npm install --global --no-audit --no-fund opencode-ai@1.19.6
      - name: Install pi
        if: matrix.harness == 'pi'
        # renovate: datasource=npm depName=@earendil-works/pi-coding-agent
        run: npm install --global --no-audit --no-fund @earendil-works/pi-coding-agent@1.6.0
      # Antigravity isn't on npm: its installer puts `agy` in ~/.local/bin.
      - name: Install antigravity
        if: matrix.harness == 'antigravity'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check detection and flags
        env:
          HARNESSES: ${{ matrix.harness }}
        run: pnpm test:harnesses
