name: Harness CLIs

# Installs the real harness CLIs and checks that help-me still finds them and calls them with flags they know.
# No model is called and nothing is logged in, so it needs no secrets. It runs on a PR only when the code it covers
# changes (test/boundaries.test.ts fails if providers.ts starts importing a file missing from `paths`), weekly to
# catch a new CLI release, and by hand from the Actions tab for any branch.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - skills/help-me/providers.ts
      - skills/help-me/schema.ts
      - test/harnesses/**
      - .github/workflows/harnesses.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: ${{ matrix.harness }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Always the latest release: catching a CLI that changed its flags is the point.
          - harness: claude
            install: npm install --global @anthropic-ai/claude-code
          - harness: codex
            install: npm install --global @openai/codex
          - harness: antigravity
            install: curl -fsSL https://antigravity.google/cli/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          - harness: opencode
            install: npm install --global opencode-ai
          - harness: pi
            install: npm install --global @earendil-works/pi-coding-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install ${{ matrix.harness }}
        run: ${{ matrix.install }}
      - name: Check detection and flags
        env:
          HARNESSES: ${{ matrix.harness }}
        run: pnpm test:harnesses
