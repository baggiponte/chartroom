name: Harness CLIs

# Installs the real harness CLIs and checks that help-me still finds them and calls them with flags they know.
# No model is called and nothing is logged in, so it needs no secrets. It runs on a PR only when the code it covers
# changes (test/boundaries.test.ts fails if providers.ts starts importing a file missing from `paths`) or a pinned CLI
# is bumped, weekly for Antigravity (its installer has no version to pin), and by hand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - skills/help-me/providers.ts
      - skills/help-me/providers/**
      - skills/help-me/schema.ts
      - test/harnesses/**
      - .github/workflows/harnesses.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: ${{ matrix.harness }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each npm CLI is pinned in test/harnesses/clis/<harness>/package-lock.json, and Renovate bumps it as soon as
          # it is released, so a CLI that changed its flags shows up on the bump's PR.
          - harness: claude
            npm: true
          - harness: codex
            npm: true
          - harness: antigravity
          - harness: opencode
            npm: true
          - harness: pi
            npm: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # From a lockfile, so CI runs the exact version a PR reviewed. The harness name goes through env, not straight
      # into the script, so no matrix value is ever run as code.
      - name: Install ${{ matrix.harness }}
        if: matrix.npm
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          npm ci --prefix "test/harnesses/clis/$HARNESS" --no-audit --no-fund
          echo "$PWD/test/harnesses/clis/$HARNESS/node_modules/.bin" >> "$GITHUB_PATH"
      # Antigravity isn't on npm: its installer puts `agy` in ~/.local/bin.
      - name: Install antigravity
        if: matrix.harness == 'antigravity'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check detection and flags
        env:
          HARNESSES: ${{ matrix.harness }}
        run: pnpm test:harnesses
