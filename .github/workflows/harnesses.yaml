name: Harness CLIs

# Installs the real harness CLIs and checks that help-me still finds them and calls them with flags they know.
# No model is called and nothing is logged in, so it needs no secrets. It runs on a PR only when the code it covers
# changes (test/boundaries.test.ts fails if providers.ts starts importing a file missing from `paths`), weekly to
# catch a new CLI release, and by hand from the Actions tab for any branch.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - skills/help-me/providers.ts
      - skills/help-me/providers/**
      - skills/help-me/schema.ts
      - test/harnesses/**
      - .github/workflows/harnesses.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: ${{ matrix.harness }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Always the latest release: catching a CLI that changed its flags is the point.
          - harness: claude
            package: "@anthropic-ai/claude-code"
          - harness: codex
            package: "@openai/codex"
          - harness: antigravity
          - harness: opencode
            package: opencode-ai
          - harness: pi
            package: "@earendil-works/pi-coding-agent"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # The package goes through env, not straight into the script, so no matrix value is ever run as code.
      - name: Install ${{ matrix.harness }}
        if: matrix.package
        env:
          PACKAGE: ${{ matrix.package }}
        run: npm install --global "$PACKAGE"
      # Antigravity isn't on npm: its installer puts `agy` in ~/.local/bin.
      - name: Install antigravity
        if: matrix.harness == 'antigravity'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check detection and flags
        env:
          HARNESSES: ${{ matrix.harness }}
        run: pnpm test:harnesses
