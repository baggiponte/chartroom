version: 2
updates:
  # The harness CLIs: a release can change the flags help-me passes, so they are checked daily and bumped together in
  # one PR, which runs the Harness CLIs workflow. zizmor wants a release to be at least 7 days old before it is taken.
  - package-ecosystem: npm
    directories:
      - /test/harnesses/clis/*
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      harness-clis:
        patterns: ["*"]

  # The dev tooling in the root package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        patterns: ["*"]

  # Actions stay pinned to a commit SHA; Dependabot updates the SHA and its version comment.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
